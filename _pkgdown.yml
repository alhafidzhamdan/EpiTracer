url: https://alhafidzhamdan.github.io/EpiTracer

template:
  bootstrap: 5
  bslib:
    primary: "#0f7d78"

home:
  title: EpiTracer
  description: >
    Calling and visualising episomal extrachromosomal DNA (ecDNA) amplicons —
    circles formed by simple excision events — from whole-genome sequencing.

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

reference:
  - title: Episomal detection
    desc: >
      Call focal amplicons that arose by simple episomal excision, and nominate
      the founder circularisation junction that bounds them.
    contents:
      - call_simple_excision
      - call_founder_boundary
      - detect_amplicon_seeds
  - title: Mechanism callers
    desc: >
      Standalone callers for the other routes to a focal amplification, each
      taking the same inputs and reporting that mechanism's signature.
    contents:
      - call_chromothripsis
      - call_chimeric_amplicon
      - call_bfb
      - call_brf
      - call_translocation_bridge_amp
      - call_chromoplexy
      - call_wgd
  - title: Visualisation
    desc: Plot the structural rearrangements underlying focal amplifications.
    contents:
      - plot_sv_linear
      - plot_sv_reconstruction
      - plot_sv_circos
  - title: Reading inputs
    desc: >
      Turn copy-number and structural-variant calls from PURPLE/GRIDSS (or any
      other source) into the columns EpiTracer expects.
    contents:
      - read_cnv
      - read_sv
      - read_purple_sv_vcf
      - prepare_amplicon_inputs
  - title: Reference data and helpers
    desc: Bundled genome annotation and small shared utilities.
    contents:
      - gene_locus
      - load_centromeres
      - load_chrom_lengths
      - find_parallel_breakpoints
  - title: Simulation
    desc: >
      Generate ecDNA amplicons with known mechanisms — a circle at birth, after
      rounds of micronucleation and chromothripsis, or fused from two episomes —
      and render them as caller or plotter inputs.
    contents:
      - sim_episome
      - sim_replicate
      - sim_segregate
      - sim_internal_deletion
      - sim_micronucleation
      - sim_reconfigure
      - sim_shatter_to_episomes
      - sim_fuse_episomes
      - sim_evolve
      - sim_cohort
      - sim_benchmark
      - sim_to_epitracer
      - sim_to_plot_inputs
      - sim_noise
      - seed_locus
      - ecdna_sim
      - summary.ecdna_sim
  - title: Example data
    desc: Small bundled datasets used in the vignettes and examples.
    contents:
      - ex_caller_inputs
      - ex_plot_inputs
      - ex_snv
      - ex_recon_inputs

articles:
  - title: Get started
    navbar: ~
    contents:
      - epitracer
  - title: Guides
    navbar: ~
    contents:
      - calling
      - plotting
      - reconstruction
