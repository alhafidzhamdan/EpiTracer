url: https://alhafidzhamdan.github.io/EpiTracer

template:
  bootstrap: 5
  bslib:
    primary: "#0f7d78"

home:
  title: EpiTracer
  description: >
    Calling and visualising episomal extrachromosomal DNA (ecDNA) amplicons —
    circles formed by simple excision events — from whole-genome sequencing.

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

reference:
  - title: Detection
    desc: Call ecDNA amplicons that arose by simple episomal excision.
    contents:
      - call_episomal_ecdna
      - detect_amplicon_seeds
  - title: Visualisation
    desc: Plot the structural rearrangements underlying focal amplifications.
    contents:
      - plot_sv_linear
      - plot_sv_reconstruction
  - title: Simulation
    desc: >
      Generate ecDNA amplicons with known mechanisms — a circle at birth, after
      rounds of micronucleation and chromothripsis, or fused from two episomes —
      and render them as caller or plotter inputs.
    contents:
      - sim_episome
      - sim_replicate
      - sim_segregate
      - sim_internal_deletion
      - sim_micronucleation
      - sim_shatter_to_episomes
      - sim_fuse_episomes
      - sim_evolve
      - sim_cohort
      - sim_to_epitracer
      - sim_to_plot_inputs
      - sim_noise
      - sim_benchmark
      - seed_locus
      - ecdna_sim
      - summary.ecdna_sim
  - title: Example data
    desc: Small bundled datasets used in the vignette and examples.
    contents:
      - ex_caller_inputs
      - ex_plot_inputs
      - ex_snv
      - ex_recon_inputs

articles:
  - title: Get started
    navbar: ~
    contents:
      - epitracer
  - title: Guides
    navbar: ~
    contents:
      - calling
      - plotting
      - reconstruction
